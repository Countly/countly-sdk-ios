name: Build the SDK

permissions:
  checks: write
  pull-requests: write

on:
    push:
      branches:
        - master
        - staging
    pull_request:
      branches:
        - master
        - staging
jobs:
  build:
    runs-on: macos-${{ matrix.env.os_version }}
    strategy:
      fail-fast: false
      matrix:
        env:
          [
            { os_version: 14, sdk: "macosx14.5", xcode: "15.4" },
            { os_version: 14, sdk: "iphoneos17.5", xcode: "15.4"},
            { os_version: 14, sdk: "appletvos17.5", xcode: "15.4"},
            { os_version: 14, sdk: "watchos10.5", xcode: "15.4" },
            { os_version: 14, sdk: "xros1.2", xcode: "15.4" },
            { os_version: 14, sdk: "iphoneos17.2", xcode: "15.2" },
            { os_version: 14, sdk: "macosx14.2", xcode: "15.2" },
            { os_version: 14, sdk: "appletvos17.2", xcode: "15.2" },
            { os_version: 14, sdk: "watchos10.2", xcode: "15.2" },
            { os_version: 14, sdk: "xros1.0", xcode: "15.2" },
            { os_version: 15, sdk: "macosx15.5", xcode: "16.4" },
            { os_version: 15, sdk: "iphoneos18.5", xcode: "16.4" },
            { os_version: 15, sdk: "appletvos18.5", xcode: "16.4" },
            { os_version: 15, sdk: "watchos11.5", xcode: "16.4" },
            { os_version: 15, sdk: "xros2.5", xcode: "16.4" },
            { os_version: 26, sdk: "macosx26.2", xcode: "26.2"},
            { os_version: 26, sdk: "iphoneos26.2", xcode: "26.2"},
            { os_version: 26, sdk: "appletvos26.2", xcode: "26.2"},
            { os_version: 26, sdk: "watchos26.2", xcode: "26.2"},
            { os_version: 26, sdk: "xros26.2", xcode: "26.2"}
          ]
    steps:
      # To check the github context
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ matrix.env.xcode }}.app

      - name: Build for the sdk ${{ matrix.env.sdk }} on macOS ${{ matrix.env.os_version }}
        run: xcodebuild -project Countly.xcodeproj build -sdk ${{ matrix.env.sdk }}

  # The CountlyTests bundle is built and run for every platform the SDK ships to.
  # Device SDKs cannot host tests, so each build matrix cell is mirrored here against
  # the matching simulator (or the runner itself for macOS).
  test:
    name: Test ${{ matrix.env.platform }} ${{ matrix.env.os }} (Xcode ${{ matrix.env.xcode }})
    runs-on: macos-${{ matrix.env.os_version }}
    strategy:
      fail-fast: false
      matrix:
        env:
          [
            { os_version: 14, platform: "macOS",    os: "14.5", xcode: "15.4" },
            { os_version: 14, platform: "iOS",      os: "17.5", xcode: "15.4" },
            { os_version: 14, platform: "tvOS",     os: "17.5", xcode: "15.4" },
            { os_version: 14, platform: "watchOS",  os: "10.5", xcode: "15.4" },
            { os_version: 14, platform: "visionOS", os: "1.2",  xcode: "15.4" },
            { os_version: 14, platform: "macOS",    os: "14.2", xcode: "15.2" },
            { os_version: 14, platform: "iOS",      os: "17.2", xcode: "15.2" },
            { os_version: 14, platform: "tvOS",     os: "17.2", xcode: "15.2" },
            { os_version: 14, platform: "watchOS",  os: "10.2", xcode: "15.2" },
            { os_version: 14, platform: "visionOS", os: "1.0",  xcode: "15.2" },
            { os_version: 15, platform: "macOS",    os: "15.5", xcode: "16.4" },
            { os_version: 15, platform: "iOS",      os: "18.5", xcode: "16.4" },
            { os_version: 15, platform: "tvOS",     os: "18.5", xcode: "16.4" },
            { os_version: 15, platform: "watchOS",  os: "11.5", xcode: "16.4" },
            { os_version: 15, platform: "visionOS", os: "2.5",  xcode: "16.4" },
            { os_version: 26, platform: "macOS",    os: "26.2", xcode: "26.2" },
            { os_version: 26, platform: "iOS",      os: "26.2", xcode: "26.2" },
            { os_version: 26, platform: "tvOS",     os: "26.2", xcode: "26.2" },
            { os_version: 26, platform: "watchOS",  os: "26.2", xcode: "26.2" },
            { os_version: 26, platform: "visionOS", os: "26.2", xcode: "26.2" }
          ]
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ matrix.env.xcode }}.app

      # `xcodebuild -showdestinations` only reports placeholder simulator entries on the
      # runner images, so the destination is resolved through simctl: prefer the requested
      # runtime, fall back to the newest installed one, and create a device when the image
      # ships a runtime without any.
      - name: Resolve test destination
        id: destination
        if: matrix.env.platform != 'macOS'
        env:
          PLATFORM: ${{ matrix.env.platform }}
          WANTED_OS: ${{ matrix.env.os }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          PLATFORM = os.environ["PLATFORM"]          # iOS | tvOS | watchOS | visionOS
          WANTED = os.environ["WANTED_OS"]           # e.g. "26.2"
          # simctl calls visionOS runtimes "xrOS".
          SIMCTL_PLATFORM = {"visionOS": "xrOS"}.get(PLATFORM, PLATFORM)


          def simctl(*args):
              out = subprocess.run(["xcrun", "simctl"] + list(args), capture_output=True, text=True)
              if out.returncode != 0:
                  sys.exit("::error::xcrun simctl %s failed: %s" % (" ".join(args), out.stderr.strip()))
              return out.stdout


          def version(text):
              parts = []
              for chunk in text.split("."):
                  try:
                      parts.append(int(chunk))
                  except ValueError:
                      parts.append(0)
              return tuple(parts)


          runtimes = [
              r for r in json.loads(simctl("list", "-j", "runtimes"))["runtimes"]
              if r.get("isAvailable") and r.get("platform") == SIMCTL_PLATFORM
          ]
          if not runtimes:
              sys.exit("::error::No %s simulator runtime is installed on this runner." % PLATFORM)

          runtime = next((r for r in runtimes if r.get("version") == WANTED), None)
          if runtime is None:
              runtime = max(runtimes, key=lambda r: version(r.get("version", "0")))
              print("::warning::%s %s runtime is not installed; testing against %s instead."
                    % (PLATFORM, WANTED, runtime.get("version")))

          devices = json.loads(simctl("list", "-j", "devices", "available"))["devices"]
          usable = [d for d in devices.get(runtime["identifier"], []) if d.get("isAvailable")]

          if usable:
              udid = usable[0]["udid"]
              name = usable[0].get("name")
          else:
              # Runner images ship runtimes without devices for some platforms, so make one.
              types = runtime.get("supportedDeviceTypes") or []
              if not types:
                  sys.exit("::error::No device type supports %s %s." % (PLATFORM, runtime.get("version")))
              name = types[0]["name"]
              udid = simctl("create", "cly-ci-%s" % PLATFORM, types[0]["identifier"],
                            runtime["identifier"]).strip()
              print("::notice::Created %s simulator '%s' for %s %s."
                    % (PLATFORM, name, PLATFORM, runtime.get("version")))

          print("Using %s Simulator '%s' (%s) on %s" % (PLATFORM, name, udid, runtime.get("version")))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("destination=platform=%s Simulator,id=%s\n" % (PLATFORM, udid))
          PYEOF

      - name: Run the CountlyTests bundle
        run: |
          xcodebuild test \
            -project Countly.xcodeproj \
            -scheme CountlyTests \
            -destination "${{ matrix.env.platform == 'macOS' && 'platform=macOS' || steps.destination.outputs.destination }}" \
            -resultBundlePath "TestResults-${{ matrix.env.platform }}-${{ matrix.env.xcode }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.env.platform }}-${{ matrix.env.os }}-xcode${{ matrix.env.xcode }}
          path: TestResults-*.xcresult
          if-no-files-found: ignore
