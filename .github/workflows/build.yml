name: Build the SDK

permissions:
  checks: write
  pull-requests: write

on:
    push:
      branches:
        - master
        - staging
    pull_request:
      branches:
        - master
        - staging
    # Also dispatchable by hand, e.g. to re-run just the tests.
    workflow_dispatch:
jobs:
  build:
    runs-on: macos-${{ matrix.env.os_version }}
    strategy:
      fail-fast: false
      matrix:
        env:
          [
            { os_version: 14, sdk: "macosx14.5", xcode: "15.4" },
            { os_version: 14, sdk: "iphoneos17.5", xcode: "15.4" },
            { os_version: 14, sdk: "appletvos17.5", xcode: "15.4" },
            { os_version: 14, sdk: "watchos10.5", xcode: "15.4" },
            { os_version: 14, sdk: "xros1.2", xcode: "15.4" },
            { os_version: 14, sdk: "iphoneos17.2", xcode: "15.2" },
            { os_version: 14, sdk: "macosx14.2", xcode: "15.2" },
            { os_version: 14, sdk: "appletvos17.2", xcode: "15.2" },
            { os_version: 14, sdk: "watchos10.2", xcode: "15.2" },
            { os_version: 14, sdk: "xros1.0", xcode: "15.2" },
            { os_version: 15, sdk: "macosx15.5", xcode: "16.4" },
            { os_version: 15, sdk: "iphoneos18.5", xcode: "16.4" },
            { os_version: 15, sdk: "appletvos18.5", xcode: "16.4" },
            { os_version: 15, sdk: "watchos11.5", xcode: "16.4" },
            { os_version: 15, sdk: "xros2.5", xcode: "16.4" },
            { os_version: 26, sdk: "macosx26.2", xcode: "26.2" },
            { os_version: 26, sdk: "iphoneos26.2", xcode: "26.2" },
            { os_version: 26, sdk: "appletvos26.2", xcode: "26.2" },
            { os_version: 26, sdk: "watchos26.2", xcode: "26.2" },
            { os_version: 26, sdk: "xros26.2", xcode: "26.2" }
          ]
    steps:
      # To check the github context
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ matrix.env.xcode }}.app

      - name: Build for the sdk ${{ matrix.env.sdk }} on macOS ${{ matrix.env.os_version }}
        run: xcodebuild -project Countly.xcodeproj build -sdk ${{ matrix.env.sdk }}

  # The CountlyTests bundle runs on all five platforms. Device SDKs cannot host tests, so each
  # cell targets the matching simulator (the runner itself for macOS).
  #
  # `continue-on-error` makes this advisory: a failing cell is reported, and it is up to the
  # developer to decide whether to act on it, but it does not fail the run. Parts of the suite
  # assert exact wall-clock durations and are fragile on a loaded runner.
  #
  # Only the newest Xcode row is covered, on purpose. The account has a single concurrent macOS
  # runner, so every matrix cell runs strictly one after another, and a full suite is ~8 minutes
  # of test execution per platform. Widening this to all four Xcode rows would put a PR at
  # roughly 3.5 hours.
  test:
    # Builds come first: with a single concurrent runner they would otherwise queue behind the
    # much slower test cells, and a broken build makes the test results moot anyway.
    needs: build
    name: Test ${{ matrix.env.sdk }} (Xcode ${{ matrix.env.xcode }})
    runs-on: macos-${{ matrix.env.os_version }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        env:
          [
            { os_version: 26, sdk: "macosx26.2", xcode: "26.2" },
            { os_version: 26, sdk: "iphoneos26.2", xcode: "26.2" },
            { os_version: 26, sdk: "appletvos26.2", xcode: "26.2" },
            { os_version: 26, sdk: "watchos26.2", xcode: "26.2" },
            { os_version: 26, sdk: "xros26.2", xcode: "26.2" }
          ]
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ matrix.env.xcode }}.app

      # Resolved before anything expensive so a runner image missing the runtime fails fast.
      #
      # `xcodebuild -showdestinations` only reports placeholder simulator entries on the
      # runner images, so this goes through simctl: prefer the runtime named by the sdk, fall
      # back to the newest installed one, and create a device when the image ships a runtime
      # without any.
      - name: Resolve test destination
        id: destination
        env:
          SDK: ${{ matrix.env.sdk }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, sys

          # `sdk` is the single source of truth: "iphoneos17.5" -> platform iOS, version 17.5.
          SDK = os.environ["SDK"]
          SDK_PREFIX_TO_PLATFORM = {
              "macosx": "macOS", "iphoneos": "iOS", "appletvos": "tvOS",
              "watchos": "watchOS", "xros": "visionOS",
          }
          prefix = re.match(r"[a-z]+", SDK).group(0)
          PLATFORM = SDK_PREFIX_TO_PLATFORM[prefix]
          WANTED = SDK[len(prefix):]


          def emit(destination):
              print("Testing on %s" % destination)
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("destination=%s\n" % destination)
              sys.exit(0)


          # macOS tests run on the runner itself, no simulator involved.
          if PLATFORM == "macOS":
              emit("platform=macOS")


          def version(text):
              return tuple(int(c) if c.isdigit() else 0 for c in text.split("."))


          listing = subprocess.run(["xcrun", "simctl", "list", "-j"], capture_output=True, text=True)
          if listing.returncode != 0:
              sys.exit("::error::xcrun simctl list failed: %s" % listing.stderr.strip())
          listing = json.loads(listing.stdout)

          # simctl calls visionOS runtimes "xrOS".
          simctl_platform = "xrOS" if PLATFORM == "visionOS" else PLATFORM
          runtimes = [
              r for r in listing["runtimes"]
              if r.get("isAvailable") and r.get("platform") == simctl_platform
          ]
          if not runtimes:
              sys.exit("::error::No %s simulator runtime is installed on this runner." % PLATFORM)

          runtime = next((r for r in runtimes if r.get("version") == WANTED), None)
          if runtime is None:
              runtime = max(runtimes, key=lambda r: version(r.get("version", "0")))
              print("::warning::%s %s runtime is not installed; testing against %s instead."
                    % (PLATFORM, WANTED, runtime.get("version")))

          usable = [d for d in listing["devices"].get(runtime["identifier"], []) if d.get("isAvailable")]
          if usable:
              udid = usable[0]["udid"]
          else:
              # Runner images ship runtimes without devices for some platforms, so make one.
              types = runtime.get("supportedDeviceTypes") or []
              if not types:
                  sys.exit("::error::No device type supports %s %s." % (PLATFORM, runtime.get("version")))
              udid = subprocess.run(
                  ["xcrun", "simctl", "create", "cly-ci", types[0]["identifier"], runtime["identifier"]],
                  capture_output=True, text=True, check=True).stdout.strip()
              print("Created %s '%s' on %s" % (PLATFORM, types[0]["name"], runtime.get("version")))

          emit("platform=%s Simulator,id=%s" % (PLATFORM, udid))
          PYEOF

      - name: Run the CountlyTests bundle
        run: |
          xcodebuild test \
            -project Countly.xcodeproj \
            -scheme CountlyTests \
            -destination '${{ steps.destination.outputs.destination }}' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Only on failure: a green run's result bundle is tens of MB nobody opens.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.env.sdk }}-xcode${{ matrix.env.xcode }}
          path: TestResults.xcresult
          if-no-files-found: ignore
